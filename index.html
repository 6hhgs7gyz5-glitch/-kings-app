<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KINGS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>KINGS 9.2.12 — Sistema Financeiro</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" data-action="menu" aria-label="Menu">☰</button>
    <div class="brand">
      <div class="brand-mark"><img src="logo.png" alt="KINGS"></div>
      <div><div class="brand-name">KINGS</div><div class="brand-sub">SISTEMA FINANCEIRO</div></div>
    </div>
    <button class="icon-btn" data-action="settings" aria-label="Configurações">⚙</button>
  </header>

  <main id="main"></main>

  <nav class="bottom-nav" id="bottomNav">
    <button data-nav="home"><span>⌂</span>Início</button>
    <button data-nav="cash"><span>▣</span>Caixa</button>
    <button data-nav="receivables"><span>▤</span>Receitas</button>
    <button data-nav="expenses"><span>▦</span>Despesas</button>
    <button data-nav="clients"><span>♙</span>Clientes</button>
    <button data-nav="more"><span>•••</span>Mais</button>
  </nav>
</div>

<div id="drawer" class="drawer">
  <div class="drawer-card">
    <button class="close" data-action="closeDrawer">×</button>
    <div class="drawer-title">KINGS</div>
    <button data-nav="home">⌂ Início</button>
    <button data-nav="cash">▤ Caixa</button>
    <button data-nav="receivables">▣ Receitas</button>
    <button data-nav="expenses">▧ Despesas</button>
    <button data-nav="clients">♙ Clientes</button>
    <button data-nav="calendar">◫ Calendário</button>
    <button data-nav="reports">⌁ Relatórios</button>
    <button data-nav="categories">◉ Despesas por categoria</button>
    <button data-nav="more">••• Mais</button>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-card">
    <button class="close" data-action="closeModal">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
